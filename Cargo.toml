[package]
name = "devlogica-tools"
version = "1.0.0"
# egui 0.36 richiede Rust 1.95 o successivo
rust-version = "1.95"
edition = "2021"
description = "DevLogica Tools: sfondi animati, avvisi di call e pausa caffè per l'ufficio"

[dependencies]
winit = "0.30"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tray-icon = "0.26"
image = { version = "0.25", default-features = false, features = ["png"] }
dirs = "6"
egui = "0.36"
egui-wgpu = { version = "0.36", default-features = false }
egui-winit = { version = "0.36", default-features = false }
socket2 = { version = "0.6", features = ["all"] }
if-addrs = "0.15"

# Un solo backend grafico per sistema: niente Vulkan/OpenGL caricati inutilmente in memoria.
[target.'cfg(windows)'.dependencies]
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "wgsl", "dx12"] }
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_System_Threading",
] }
winreg = "0.55"

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "wgsl", "metal"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "objc2-core-foundation"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Solo per sviluppo su Linux.
[target.'cfg(not(any(windows, target_os = "macos")))'.dependencies]
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "wgsl", "vulkan"] }

# Icona e informazioni dell'eseguibile Windows (richiede gli strumenti di compilazione Microsoft).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
